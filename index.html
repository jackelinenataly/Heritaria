<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heritaria | Próximamente</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#FAF7F2;
    color:#5C4635;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    text-align:center;
    max-width:500px;
    padding:40px 30px;
}

.logo{
    width:400px;
    margin-bottom:30px;
}

h1{
    font-size:42px;
    font-weight:600;
    margin-bottom:20px;
}

p{
    font-size:18px;
    color:#7A6656;
    line-height:1.7;
    margin-bottom:40px;
}

.reclamaciones{
    margin-top:35px;
}

.libro{
    width:75px;
    transition:0.3s;
    cursor:pointer;
}

.libro:hover{
    transform:scale(1.08);
}

.texto-reclamo{
    display:block;
    margin-top:10px;
    text-decoration:none;
    color:#A97445;
    font-size:15px;
    font-weight:600;
}

.texto-reclamo:hover{
    color:#7B5636;
}

.btn:hover{
    background:#A97445;
    transform:translateY(-2px);
}

.footer{
    margin-top:60px;
    font-size:14px;
    color:#9A8A7C;
}
</style>

</head>

<body>

<div class="container">

    <!-- Reemplaza logo-heritaria.png por tu logo -->
    <img src="imag/logo-heritaria.png" alt="Heritaria" class="logo">

    <h1>
        Muy pronto...</h1>

    <p>
        Estamos preparando un espacio lleno de postres y recuerdos para ti.
    
    </p>

    <div class="reclamaciones">

    <a href="mailto:librodereclamaciones@puntoazulrestaurante.com?subject=Libro%20de%20Reclamaciones">
        <img src="imag/libroreclamaciones.png"
             class="libro">
    </a>

    <a href="mailto:librodereclamaciones@puntoazulrestaurante.com?subject=Libro%20de%20Reclamaciones"
       class="texto-reclamo">
        
    </a>

</div>

    <div class="footer">
        © 2026 Heritaria · Todos los derechos reservados.
    </div>

</div>

</body>
</html>
